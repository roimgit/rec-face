name: sol_it_absensi_wajah
description: Aplikasi Mobile Absensi Sensor Wajah, Liveness, GPS Geofence, CRUD, Master Data, Log & Laporan untuk Sol-IT.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
